<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samon PowerShell</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #cccccc;
      font-family: "Consolas", "MS Gothic", "Courier New", monospace;
      font-size: 15px;
      line-height: 1.45;
    }
    .shell {
      min-height: 100%;
      padding: 10px 14px 28px;
      cursor: text;
    }
    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cyan {
      color: #38bdf8;
    }
    .green {
      color: #4ade80;
    }
    .yellow {
      color: #facc15;
    }
    .gray {
      color: #9ca3af;
    }
    a.rec-link {
      color: #38bdf8;
      text-decoration: underline;
    }
    .prompt-row {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      margin-top: 2px;
    }
    .prompt-label {
      color: #cccccc;
      white-space: nowrap;
      margin-right: 4px;
    }
    .cmd-input {
      flex: 1;
      min-width: 120px;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div id="output"></div>
    <div class="prompt-row" id="promptRow">
      <span class="prompt-label">PS C:\WINDOWS\system32&gt;</span>
      <input type="text" class="cmd-input" id="cmdInput" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <script>
    const STORAGE_KEY = "samon_ps_padlet_state_v5";
    const RENDER_BASE_URL = "https://test1-1-qyfl.onrender.com/";

    const outputEl = document.getElementById("output");
    const promptRowEl = document.getElementById("promptRow");
    const cmdInput = document.getElementById("cmdInput");
    const shellEl = document.getElementById("shell");

    const defaultState = {
      apiUrl: RENDER_BASE_URL,
      roomUrl: "",
      message: "",
      commentMessage: "",
      gifUrl: "",
      cookie: "",
      repeat: 1,
      commentRepeat: 1,
      enablePost: true,
      enableComment: false,
      enableVideo: true
    };

    let state = loadState();
    if (!state.apiUrl) {
      state.apiUrl = RENDER_BASE_URL;
      saveState();
    }

    let history = [];
    let historyIdx = -1;
    let isRunning = false;
    const savedRecordings = [];

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? Object.assign({}, defaultState, JSON.parse(raw)) : Object.assign({}, defaultState);
      } catch (_) {
        return Object.assign({}, defaultState);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function appendLine(text, cls = "") {
      const div = document.createElement("div");
      div.className = "line" + (cls ? " " + cls : "");
      div.textContent = text;
      outputEl.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    function appendRich(parts) {
      const div = document.createElement("div");
      div.className = "line";
      parts.forEach(([txt, cls]) => {
        const span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = txt;
        div.appendChild(span);
      });
      outputEl.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    function appendDownloadLink(blobUrl, fileName) {
      const div = document.createElement("div");
      div.className = "line cyan";
      const prefix = document.createTextNode("  録画ファイル保存リンク: ");
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = fileName;
      a.className = "rec-link";
      a.textContent = fileName;
      div.appendChild(prefix);
      div.appendChild(a);
      outputEl.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function saveRecordingToBrowser(base64Str, mimeType = "video/webm", fileName = "samon_run.webm") {
      const binStr = atob(base64Str);
      const len = binStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binStr.charCodeAt(i);
      }
      const blob = new Blob([bytes], { type: mimeType });
      const blobUrl = URL.createObjectURL(blob);

      savedRecordings.push({
        fileName,
        blobUrl,
        sizeKB: Math.round(bytes.length / 1024),
        savedAt: new Date().toISOString()
      });

      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      appendLine(`  録画を保存しました: ${fileName} (${Math.round(bytes.length / 1024)} KB)`, "green");
      appendDownloadLink(blobUrl, fileName);
    }

    function printBanner() {
      appendLine("Samon PowerShell");
      appendLine("Copyright (C) Microsoft Corporation. All rights reserved.");
      appendLine("");
      appendRich([
        ["新機能と改善のために 最新の PowerShell をインストールしてください！ ", ""],
        ["https://aka.ms/PSWindows", "cyan"]
      ]);
      appendLine("");
      appendRich([
        ["利用可能なコマンド一覧を確認するには ", ""],
        ["help", "cyan"],
        [" または ", ""],
        ["cls", "cyan"],
        [" と入力してください。", ""]
      ]);
      appendLine("");
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function setPromptVisible(visible) {
      promptRowEl.style.display = visible ? "flex" : "none";
      cmdInput.disabled = !visible;
      if (visible) {
        cmdInput.focus();
      }
    }

    function tokenize(raw) {
      const tokens = [];
      const regex = /[^\s"]+|"([^"]*)"/g;
      let match;
      while ((match = regex.exec(raw)) !== null) {
        tokens.push(match[1] !== undefined ? match[1] : match[0]);
      }
      return tokens;
    }

    function stripOuterQuotes(str) {
      const s = str.trim();
      if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) {
        return s.slice(1, -1);
      }
      return s;
    }

    function parseToggle(val) {
      const v = String(val || "").trim().toLowerCase();
      if (["on", "true", "1", "yes", "enable"].includes(v)) return true;
      if (["off", "false", "0", "no", "disable"].includes(v)) return false;
      return null;
    }

    async function runBotSequence() {
      if (isRunning) {
        appendLine("すでに実行中です。", "yellow");
        return;
      }

      if (!state.roomUrl) {
        appendLine("エラー: roomUrl が未設定です。先に set-url <URL> を実行してください。", "yellow");
        appendLine("");
        return;
      }

      if (!state.enablePost && !state.enableComment) {
        appendLine("エラー: 投稿とコメントが両方 OFF です。set-post on または set-comment on を設定してください。", "yellow");
        appendLine("");
        return;
      }

      const endpoint = (state.apiUrl || RENDER_BASE_URL).replace(/\/+$/, "") + "/run";
      isRunning = true;
      setPromptVisible(false);

      const startedAt = Date.now();
      appendLine("Render サーバーへリクエストを送信中...", "cyan");
      appendLine("Endpoint       : " + endpoint, "gray");
      appendLine("Room URL       : " + state.roomUrl, "gray");
      appendLine(
        "Mode           : 投稿=" +
          (state.enablePost ? "ON" : "OFF") +
          " / コメント=" +
          (state.enableComment ? "ON" : "OFF") +
          " / 録画=" +
          (state.enableVideo ? "ON" : "OFF"),
        "gray"
      );
      appendLine("Message        : " + (state.message || "(未設定)"), "gray");
      if (state.enableComment) {
        appendLine("Comment Msg    : " + (state.commentMessage || state.message || "(未設定)"), "gray");
        appendLine("Comment Repeat : " + state.commentRepeat + " 回/投稿", "gray");
      }
      appendLine("GIF URL        : " + (state.gifUrl || "(未設定)"), "gray");
      if (state.enablePost) {
        appendLine("Repeat         : " + state.repeat + " 回/セクション", "gray");
      }
      if (state.enablePost && state.enableComment && state.repeat >= 2) {
        appendLine("ヒント: 投稿＋コメントを同時実行すると時間が長くなります。必要なら処理を分けて実行してください。", "yellow");
      }
      appendLine("");

      const progressLine = appendLine("  [待機中] Playwright 実行中... (0秒経過)", "gray");
      const progressTimer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startedAt) / 1000);
        progressLine.textContent = `  [待機中] Playwright 実行中... (${elapsed}秒経過)`;
        window.scrollTo(0, document.body.scrollHeight);
      }, 1000);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 600000);

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          signal: controller.signal,
          body: JSON.stringify({
            roomUrl: state.roomUrl,
            message: state.message,
            commentMessage: state.commentMessage,
            gifUrl: state.gifUrl,
            cookie: state.cookie,
            repeat: state.repeat,
            commentRepeat: state.commentRepeat,
            enablePost: state.enablePost,
            enableComment: state.enableComment,
            enableVideo: state.enableVideo
          })
        });

        clearTimeout(timeoutId);
        clearInterval(progressTimer);

        const rawText = await res.text();
        let data = null;
        try {
          data = JSON.parse(rawText);
        } catch (_) {
          progressLine.textContent = `  [応答受信] HTTP ${res.status} (非JSON応答)`;
          progressLine.className = "line yellow";
          appendLine("サーバー応答（生テキスト）: " + rawText, "yellow");
          appendLine("");
          return;
        }

        const totalSec = ((Date.now() - startedAt) / 1000).toFixed(1);
        progressLine.textContent = `  [応答受信] HTTP ${res.status} (${totalSec}秒で完了)`;
        progressLine.className = res.ok && data.ok ? "line cyan" : "line yellow";

        if (Array.isArray(data.logs) && data.logs.length > 0) {
          appendLine("--- 実行ログ一覧 ---", "cyan");
          for (const item of data.logs) {
            await sleep(60);
            const isOk = item.status !== "error";
            const tag = item.type === "comment" ? "COMMENT" : "POST";
            const statusText = item.detail ? ` - ${item.detail}` : "";
            appendLine(
              `  -> [${tag}][${item.section}] ${item.attempt} 回目${statusText} (${item.timestamp || ""})`,
              isOk ? "green" : "yellow"
            );
          }
        } else {
          appendLine("  (サーバーからの詳細ログ配列は空です)", "gray");
        }

        if (data.videoBase64) {
          saveRecordingToBrowser(
            data.videoBase64,
            data.videoMimeType || "video/webm",
            data.videoFileName || `samon_run_${Date.now()}.webm`
          );
        } else if (state.enableVideo) {
          appendLine("  (録画データは含まれていませんでした)", "gray");
        }

        if (!res.ok || !data.ok) {
          appendLine("エラー: " + (data.error || "HTTP " + res.status), "yellow");
          appendLine("レスポンス詳細: " + JSON.stringify({ ...data, videoBase64: undefined }), "gray");
          appendLine("");
          return;
        }

        const sectionInfo = state.enablePost ? `検出セクション: ${data.detectedSections ?? 1} / ` : "";
        appendLine(
          `${sectionInfo}読込Cookie: ${data.cookiesLoaded ?? 0} 件 / 成功: ${data.successCount ?? 0} / 合計: ${data.totalSteps ?? 0}`,
          "cyan"
        );
        appendLine("");
      } catch (err) {
        clearTimeout(timeoutId);
        clearInterval(progressTimer);
        const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
        progressLine.textContent = `  [通信中断] ${elapsed}秒経過時点でエラー発生`;
        progressLine.className = "line yellow";

        const isAbort = err && err.name === "AbortError";
        const msg = isAbort
          ? `リクエストがタイムアウトしました（${elapsed}秒経過）。repeat回数や対象セクション数を減らすか、投稿とコメントを分けて実行してみてください。`
          : err && err.message
            ? err.message
            : String(err);

        appendLine("通信エラー: " + msg, "yellow");
        appendLine("エラー種別: " + (err && err.name ? err.name : "Error"), "gray");
        appendLine("ヒント: 投稿とコメントを別々に実行するか、set-rec off で録画を切ると安定しやすくなります。", "gray");
        appendLine("");
      } finally {
        isRunning = false;
        setPromptVisible(true);
      }
    }

    async function handleCommand(rawLine) {
      const trimmed = rawLine.trim();
      appendLine("PS C:\\WINDOWS\\system32>" + rawLine);

      if (!trimmed) return;

      history.push(rawLine);
      historyIdx = history.length;

      const tokens = tokenize(trimmed);
      const cmd = tokens[0].toLowerCase();
      const argText = trimmed.slice(tokens[0].length).trim();

      if (cmd === "cls" || cmd === "clear") {
        outputEl.innerHTML = "";
        return;
      }

      if (cmd === "reset-config") {
        state = Object.assign({}, defaultState);
        saveState();
        appendLine("設定を初期値にリセットしました。", "green");
        return;
      }

      if (cmd === "help") {
        appendLine("利用可能なコマンド:", "cyan");
        appendLine("  help                   コマンド一覧を表示");
        appendLine("  cls                    画面をクリア");
        appendLine("  config                 現在の設定を表示");
        appendLine("  reset-config           設定を初期値に戻す");
        appendLine("  recordings             取得した録画一覧を表示");
        appendLine("  set-post <on|off>      新規投稿をするか設定（既定: on）");
        appendLine("  set-comment <on|off>   全投稿へコメントをするか設定（既定: off）");
        appendLine("  set-rec <on|off>       実行中の録画保存をするか設定（既定: on）");
        appendLine("  set-api <URL>          Renderエンドポイントを設定");
        appendLine("  set-url <URL>          部屋のURLを設定");
        appendLine("  set-msg <TEXT>         投稿用メッセージを設定");
        appendLine("  set-cmsg <TEXT>        コメント用メッセージを設定（未設定時は投稿msgを使用）");
        appendLine("  set-crepeat <NUM>      1投稿あたりのコメント繰り返し回数を設定（1〜10、既定: 1）");
        appendLine("  set-gif <URL>          GIF画像URLを設定");
        appendLine("  set-cookie <VALUE>     Cookie（JSON配列または key=val 文字列）を設定");
        appendLine("  clear-cookie           保存済みCookieを削除");
        appendLine("  set-repeat <NUM>       1セクションあたりの投稿繰り返し回数を設定（1〜10、既定: 1）");
        appendLine("  run                    Renderへ送信して実行");
        appendLine("");
        return;
      }

      if (cmd === "recordings") {
        if (savedRecordings.length === 0) {
          appendLine("保存された録画はまだありません。", "gray");
          appendLine("");
          return;
        }
        appendLine("保存済み録画一覧:", "cyan");
        savedRecordings.forEach((rec, idx) => {
          appendLine(`  [${idx + 1}] ${rec.fileName} (${rec.sizeKB} KB) - ${rec.savedAt}`, "green");
          appendDownloadLink(rec.blobUrl, rec.fileName);
        });
        appendLine("");
        return;
      }

      if (cmd === "config") {
        appendLine("現在の設定:", "cyan");
        appendLine("  apiUrl        : " + (state.apiUrl || RENDER_BASE_URL));
        appendLine("  roomUrl       : " + (state.roomUrl || "(未設定)"));
        appendLine("  post          : " + (state.enablePost ? "ON" : "OFF"));
        appendLine("  comment       : " + (state.enableComment ? "ON" : "OFF"));
        appendLine("  record        : " + (state.enableVideo ? "ON" : "OFF"));
        appendLine("  message       : " + (state.message || "(未設定)"));
        appendLine("  commentMsg    : " + (state.commentMessage || "(未設定 -> messageを使用)"));
        appendLine("  commentRepeat : " + state.commentRepeat);
        appendLine("  gifUrl        : " + (state.gifUrl || "(未設定)"));
        appendLine("  cookie        : " + (state.cookie ? `設定済み (${state.cookie.length} 文字)` : "(未設定)"));
        appendLine("  repeat        : " + state.repeat);
        appendLine("");
        return;
      }

      if (cmd === "set-post") {
        const parsed = parseToggle(tokens[1]);
        if (parsed === null) {
          appendLine("on または off を指定してください（例: set-post on / set-post off）。", "yellow");
          return;
        }
        state.enablePost = parsed;
        saveState();
        appendLine("投稿モードを " + (parsed ? "ON" : "OFF") + " に設定しました。", "green");
        return;
      }

      if (cmd === "set-comment") {
        const parsed = parseToggle(tokens[1]);
        if (parsed === null) {
          appendLine("on または off を指定してください（例: set-comment on / set-comment off）。", "yellow");
          return;
        }
        state.enableComment = parsed;
        saveState();
        appendLine("コメントモードを " + (parsed ? "ON" : "OFF") + " に設定しました。", "green");
        return;
      }

      if (cmd === "set-rec") {
        const parsed = parseToggle(tokens[1]);
        if (parsed === null) {
          appendLine("on または off を指定してください（例: set-rec on / set-rec off）。", "yellow");
          return;
        }
        state.enableVideo = parsed;
        saveState();
        appendLine("録画モードを " + (parsed ? "ON" : "OFF") + " に設定しました。", "green");
        return;
      }

      if (cmd === "set-api") {
        const nextUrl = stripOuterQuotes(tokens[1] || argText);
        if (!nextUrl) {
          appendLine("URLを指定してください。", "yellow");
          return;
        }
        state.apiUrl = nextUrl;
        saveState();
        appendLine("apiUrl を更新しました: " + state.apiUrl, "green");
        return;
      }

      if (cmd === "set-url") {
        const nextRoom = stripOuterQuotes(tokens[1] || argText);
        if (!nextRoom) {
          appendLine("URLを指定してください。", "yellow");
          return;
        }
        state.roomUrl = nextRoom;
        saveState();
        appendLine("roomUrl を更新しました: " + state.roomUrl, "green");
        return;
      }

      if (cmd === "set-msg") {
        state.message = stripOuterQuotes(argText);
        saveState();
        appendLine("message を更新しました: " + state.message, "green");
        return;
      }

      if (cmd === "set-cmsg") {
        state.commentMessage = stripOuterQuotes(argText);
        saveState();
        appendLine("commentMessage を更新しました: " + state.commentMessage, "green");
        return;
      }

      if (cmd === "set-crepeat") {
        const n = parseInt(tokens[1], 10);
        if (!Number.isFinite(n) || n < 1 || n > 10) {
          appendLine("1〜10の整数を指定してください。", "yellow");
          return;
        }
        state.commentRepeat = n;
        saveState();
        appendLine("commentRepeat を " + n + " に設定しました。", "green");
        return;
      }

      if (cmd === "set-gif") {
        state.gifUrl = stripOuterQuotes(tokens[1] || argText);
        saveState();
        appendLine("gifUrl を更新しました: " + state.gifUrl, "green");
        return;
      }

      if (cmd === "set-cookie") {
        const rawCookie = argText.trim();
        if (!rawCookie) {
          appendLine("Cookie文字列またはJSONを指定してください。", "yellow");
          return;
        }
        state.cookie =
          rawCookie.startsWith("[") || rawCookie.startsWith("{")
            ? rawCookie
            : stripOuterQuotes(rawCookie);
        saveState();
        appendLine("cookie を更新しました。", "green");
        return;
      }

      if (cmd === "clear-cookie") {
        state.cookie = "";
        saveState();
        appendLine("cookie を削除しました。", "green");
        return;
      }

      if (cmd === "set-repeat") {
        const n = parseInt(tokens[1], 10);
        if (!Number.isFinite(n) || n < 1 || n > 10) {
          appendLine("1〜10の整数を指定してください。", "yellow");
          return;
        }
        state.repeat = n;
        saveState();
        appendLine("repeat を " + n + " に設定しました。", "green");
        return;
      }

      if (cmd === "run") {
        await runBotSequence();
        return;
      }

      appendLine(cmd + " : 用語 '" + cmd + "' は、コマンドレット、関数、スクリプト ファイル、または操作可能なプログラムの名前として認識されません。", "yellow");
      appendLine("");
    }

    cmdInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const val = cmdInput.value;
        cmdInput.value = "";
        await handleCommand(val);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (historyIdx > 0) {
          historyIdx -= 1;
          cmdInput.value = history[historyIdx];
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (historyIdx < history.length - 1) {
          historyIdx += 1;
          cmdInput.value = history[historyIdx];
        } else {
          historyIdx = history.length;
          cmdInput.value = "";
        }
      }
    });

    shellEl.addEventListener("click", () => {
      if (!isRunning) cmdInput.focus();
    });

    window.addEventListener("DOMContentLoaded", () => {
      printBanner();
      setPromptVisible(true);
    });
  </script>
</body>
</html>
